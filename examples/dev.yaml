---
kind: Ingress
metadata:
  name: web
  namespace: app
spec:
  rules:
    - host: dev.example.local
---
kind: Service
metadata:
  name: web
  namespace: app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
---
kind: Deployment
metadata:
  name: web
  namespace: app
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          image: nginx
        - name: metrics
          image: busybox
          securityContext:
            runAsNonRoot: true
      volumes:
        - name: cache
          emptyDir: {}
